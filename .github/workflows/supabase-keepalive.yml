name: Supabase activity
on:
  schedule:
    - cron: '23 3 * * *'
    - cron: '37 4 1 * *'
  workflow_dispatch:
    inputs:
      test_repository_heartbeat:
        description: 'Also verify the monthly repository activity commit'
        type: boolean
        default: false
permissions: {}
jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query project database
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_PUBLISHABLE_KEY"
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --max-time 20 \
              --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
              --header 'Accept: application/json' \
              "$SUPABASE_URL/rest/v1/project_keepalive?id=eq.1&select=id" | grep -q '"id":1'; then
              exit 0
            fi
            sleep 10
          done
          echo 'Supabase keepalive query failed' >&2
          exit 1
  keep-schedule-active:
    if: (github.event_name == 'schedule' && github.event.schedule == '37 4 1 * *') || (github.event_name == 'workflow_dispatch' && inputs.test_repository_heartbeat)
    needs: keepalive
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Record repository activity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m 'chore: keep scheduled Supabase activity enabled'
          git push origin HEAD:${{ github.event.repository.default_branch }}
